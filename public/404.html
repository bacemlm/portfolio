<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Bacem Lamloumi</title>
    <meta name="robots" content="noindex" />
    <!-- GitHub Pages serves this file for unknown paths. The site is a single page,
         so send visitors to it instead of leaving them on a dead end. -->
    <script>
      location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      a {
        color: #a78bfa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><a href="/portfolio/">Go to the portfolio</a></p>
    </main>
  </body>
</html>
